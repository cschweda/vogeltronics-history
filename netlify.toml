# vogeltronics.com — static site, publish the repo root as-is.
#
# The build step exists for one reason: images. Every image used to be a base64
# data URI inside index.html, which made the document 4.4 MB and meant nothing
# painted until all of it arrived — FCP and LCP both landed at 16.7 s on a
# throttled mobile connection. The originals now live in assets/img-src/, and
# `npm run build` (tools/build-images.mjs, via sharp) writes right-sized WebP
# into dist/assets/img/. dist/ is gitignored, rebuilt on every deploy, and holds
# only what the page loads — publishing the repo root also served package.json,
# tools/ and 2.9 MB of full-resolution originals to anyone who asked.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Canonicalise on the bare domain.
#
# Netlify's "primary domain" setting was supposed to do this and did not: all
# four names went on serving 200 as equals, with no Location header and no
# certificate re-issue. Putting the rules here instead means they are version
# controlled, survive dashboard edits, and work on any plan.
#
# `force = true` is required — without it a redirect yields to an existing
# file, and since this site serves index.html at "/" the rule would never fire.
# The scheme is included so the match is on host, not path.

[[redirects]]
  from = "https://www.vogeltronics.com/*"
  to = "https://vogeltronics.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://history.vogeltronics.com/*"
  to = "https://vogeltronics.com/:splat"
  status = 301
  force = true

# Deliberately no rule for vogeltronics.metaincognita.com. That address is
# retired, not moved; a redirect would keep it alive. It is removed from the
# site's domains in the Netlify dashboard instead, which is what drops it from
# the certificate.

# The six Larry voice clips are the only files the page actually fetches at
# runtime besides the images themselves. They were being served
# with no Cache-Control at all, so a repeat visitor re-downloaded 232 KiB of
# WAV to hear the same six lines. They are immutable in practice: a clip is
# re-cut under a new name, never edited in place.
#
# Scoped to *.wav on purpose. A blanket rule over /assets/* would also pin
# og-image.png, which make-og-image.py regenerates under the same filename and
# which social crawlers must be able to re-fetch.
# Security headers, applied to everything.
#
# The page has exactly one inline <script> and no on*= handlers anywhere, so
# script-src is a bare SHA-256 hash — no 'unsafe-inline', no nonce, no server.
# That is the directive that actually matters, and it is the one that would
# stop an injected <script> dead.
#
# style-src keeps 'unsafe-inline' because the markup carries 29 style=""
# attributes and a hash cannot cover those. Smaller concession than it looks: a
# style attribute cannot execute anything, and the usual CSS exfiltration trick
# needs to reach the network, which connect-src 'self' and img-src 'self' data:
# between them prevent.
#
# Everything else is off. No fonts are loaded (system stacks), the page makes
# no requests of any kind, embeds nothing and submits nothing. The external
# links in the document are <a href> navigations, which CSP does not gate.
#
# The hash is the fragile part — change a byte of the inline script and the
# browser silently refuses to run it. `npm run build` verifies it, so a
# mismatch fails the deploy and Netlify keeps serving the last good build.
# Regenerate with: node tools/csp.mjs --print
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'sha256-syU2B6V8AMwitZDUod+mbWCtoy1+dVC2qlA5kjLXy6Y='; style-src 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    # frame-ancestors above covers modern browsers; this is for the old ones
    X-Frame-Options = "DENY"
    # Nothing here uses any of it.
    Permissions-Policy = "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()"
    # includeSubDomains is safe here: gridiron., vogelvox. and history. are all
    # Netlify-hosted and HTTPS-only. `preload` is deliberately NOT set — it is
    # a one-way door that needs a removal request to undo.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/assets/*.wav"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# assets/img/ is build output: tools/build-images.mjs writes it from
# assets/img-src/ under stable filenames. Because a regenerated image keeps its
# name these are deliberately NOT immutable — a week is long enough to help a
# repeat visitor and short enough that a replaced photograph corrects itself
# without anyone having to think about cache busting.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
